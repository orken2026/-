# Render Blueprint: екі сервис.
#  1) qazaq-pdd-app — Mini App (статикалық сайт, CDN, ешқашан ұйықтамайды)
#  2) qazaq-pdd-bot — бот + API (сұрақтар мен дұрыс жауаптар осында, клиентке берілмейді)
# Қолмен енгізілетін құпия мәндер (sync: false): BOT_TOKEN, ADMIN_IDS, SUPPORT, ANTHROPIC_API_KEY.
services:
  - type: web
    name: qazaq-pdd-app
    runtime: static
    buildCommand: echo "static site"
    staticPublishPath: ./webapp

  - type: web
    name: qazaq-pdd-bot
    runtime: python
    plan: free            # тұрақты жұмыс үшін (күн сұрағы, база) — starter немесе ҚР-дағы VPS (README)
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        value: https://qazaq-pdd-app.onrender.com
      - key: PRICE_STARS
        value: "50"
      - key: PLAN_DAYS
        value: "0"
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
